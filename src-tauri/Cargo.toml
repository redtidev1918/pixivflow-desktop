[package]
name = "pixivflow-desktop"
version = "0.2.0"
description = "Cross-platform desktop shell for PixivFlow (Tauri 2). F1 — Desktop Shell MVP."
authors = ["redtidev1918"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
