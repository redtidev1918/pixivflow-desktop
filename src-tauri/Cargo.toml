[package]
name = "pixivflow-desktop"
version = "0.1.0"
description = "PixivFlow Desktop — Tauri shell for PixivFlow backend + WebUI"
authors = ["redtidev1918"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pixivflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true