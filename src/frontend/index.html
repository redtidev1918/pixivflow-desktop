<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PixivFlow Desktop</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fb; color: #1c2430;
    }
    .card {
      max-width: 460px; margin: 24px; padding: 36px 28px; text-align: center;
      background: #fff; border-radius: 14px; box-shadow: 0 10px 34px rgba(15,23,42,.10);
    }
    .spinner {
      width: 38px; height: 38px; margin: 0 auto 18px; border-radius: 50%;
      border: 4px solid rgba(99,102,241,.18); border-top-color: #6366f1;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p  { font-size: 13.5px; color: #5b6472; line-height: 1.5; margin: 0 0 6px; }
    code { background: #eef1f8; padding: 1px 6px; border-radius: 6px; font-size: 12px; }
    .err { color: #b42318; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spin"></div>
    <h1>PixivFlow Desktop</h1>
    <p id="msg">正在启动本地 PixivFlow 后端…</p>
    <p id="hint" style="display:none">
      若长时间无反应，请查看桌面日志
      <code>&lt;dataDir&gt;/logs/pixivflow-desktop.log</code>。
    </p>
  </div>
  <script>
    // Fallback/error shell. The real UI is the bundled PixivFlow WebUI served by
    // the local backend; when this page is shown it means backend startup failed
    // or autoStart is disabled. Show the detail in the window title if any.
    window.setTimeout(function () {
      document.getElementById('hint').style.display = 'block';
    }, 12000);
  </script>
</body>
</html>
