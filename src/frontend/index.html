<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PixivFlow Desktop</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="titlebar">
        <span class="logo">◧</span>
        <h1>PixivFlow Desktop</h1>
        <span id="mode" class="mode">local</span>
      </header>

      <section class="card status-card">
        <div class="status-row">
          <span id="status-dot" class="dot dot-unknown"></span>
          <span id="status-label" class="status-label">Starting…</span>
        </div>
        <p id="status-detail" class="detail">正在加载配置…</p>
      </section>

      <section class="card meta">
        <div class="meta-row"><span>后端端口</span><code id="meta-port">—</code></div>
        <div class="meta-row"><span>进程 PID</span><code id="meta-pid">—</code></div>
        <div class="meta-row"><span>配置模式</span><code id="meta-mode">—</code></div>
        <div class="meta-row"><span>配置文件</span><code id="meta-config">—</code></div>
      </section>

      <section class="card actions">
        <button id="btn-start" class="btn primary">启动 Backend</button>
        <button id="btn-stop" class="btn">停止 Backend</button>
        <button id="btn-restart" class="btn">重启</button>
      </section>

      <section class="card log-card">
        <h2>运行日志 <span class="hint">logs/desktop.log</span></h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
