<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PixivFlow Desktop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Static boot shell: the brand + shell render immediately, before JS and
         independently of backend state — the window is never blank. -->
    <main class="app" id="app">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">◧</div>
        <div class="brand-text">
          <h1>PixivFlow Desktop</h1>
          <p class="tagline">PixivFlow 的桌面运行环境和管理器</p>
        </div>
      </header>

      <p id="status-line" class="status-line">Starting PixivFlow…</p>

      <section class="card backend-card">
        <div class="backend-head">
          <span class="card-title">Backend Status</span>
          <span id="badge" class="badge badge-starting">Starting</span>
        </div>
        <dl class="meta-grid">
          <div><dt>Port</dt><dd id="meta-port">—</dd></div>
          <div><dt>PID</dt><dd id="meta-pid">—</dd></div>
          <div><dt>Health</dt><dd id="meta-health">Waiting…</dd></div>
        </dl>
      </section>

      <!-- Error surface: start failures / missing runtime / health stalls render
           here instead of leaving a blank window. -->
      <section id="error-box" class="error-box hidden">
        <strong id="error-title" class="error-title">Backend Error</strong>
        <div id="error-reason" class="error-label"></div>
        <pre id="error-detail" class="error-detail"></pre>
        <button id="btn-error-restart" class="btn">Restart</button>
      </section>

      <div class="actions">
        <button id="btn-restart" class="btn" title="Restart the local backend">Restart</button>
        <button id="btn-open-logs" class="btn" title="Open logs/desktop.log">Open Logs</button>
      </div>

      <footer class="foot">
        <span id="foot-src">source: —</span>
        <span id="foot-ver">version: —</span>
        <span id="foot-mode">mode: —</span>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
